<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <style>
        #video {
            width: 100%;
            height: auto;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>QR Code Scanner</h1>
    <video id="video" autoplay></video>
    <div id="result">Scan a QR code...</div>

    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script>
        // Função para inicializar o scanner QR com a câmera traseira
        function startQrScanner() {
            const codeReader = new ZXing.BrowserQRCodeReader();
            const videoElement = document.getElementById('video');

            // Procurar e usar a câmera traseira
            codeReader.getVideoInputDevices()
                .then(videoInputDevices => {
                    const rearCamera = videoInputDevices.find(device => device.label.toLowerCase().includes('back'));

                    if (rearCamera) {
                        // Start scanning with the back camera
                        codeReader.decodeFromVideoDevice(rearCamera.deviceId, 'video', (result, err) => {
                            if (result) {
                                document.getElementById('result').textContent = `QR Code: ${result.text}`;
                                enviarQrData(result.text);  // Enviar os dados para o Google Apps Script
                            }
                            if (err && !(err instanceof ZXing.NotFoundException)) {
                                console.error(err);
                            }
                        });
                    } else {
                        console.error('Nenhuma câmera traseira encontrada');
                    }
                })
                .catch(err => {
                    console.error(err);
                });
        }

        // Função para enviar dados lidos para o Google Apps Script
        function enviarQrData(qrData) {
            const url = 'https://script.google.com/macros/s/AKfycbzNL97Op-T_Zks_iLn7EgJV6nL0WBIiJEToRdEfi9rNsCAkGDJ_Z96jOtUuzYv8SWI/exec';  // Substitua pela URL do seu Google Apps Script
            const dados = { data: qrData };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(dados),
            })
            .then(response => response.json())
            .then(data => {
                console.log('Resposta do servidor:', data);
            })
            .catch(error => {
                console.error('Erro ao enviar dados:', error);
            });
        }

        // Inicializar o scanner ao carregar a página
        window.addEventListener('load', () => {
            startQrScanner();
        });
    </script>
</body>
</html>
